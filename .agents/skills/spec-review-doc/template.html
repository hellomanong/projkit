<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- FILL:title -->项目名 · 范围 评审稿 vX.Y<!-- /FILL:title --></title>
<style>
/* ===== 模板铁律：本样式表与页面骨架不许改，生成时只替换 FILL 内容区 ===== */
:root{
  --paper:#f4f6f5;--card:#fcfdfd;--ink:#1a2420;--ink2:#54645d;
  --line:#ccd6d1;--line-strong:#1a2420;--pine:#1e5c4f;
  --pine-soft:#e4efea;--pine-faint:#eef4f1;--seal:#b3372b;
  --seal-soft:#f6e9e6;--amber:#8a6317;--amber-soft:#f4edda;
  --blue:#415f86;--blue-soft:#e8eef6;--code-bg:#152019;--code-tx:#d9e4de;
  --song:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --sidebar-w:286px;
  --shadow:0 18px 54px rgba(28,55,45,.08);
  --shadow-soft:0 8px 28px rgba(28,55,45,.055);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.82;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 80% -10%,rgba(30,92,79,.08),transparent 30rem),
    linear-gradient(180deg,#f7f9f8 0,#eef3f0 38rem,#f4f6f5 100%);
}
a{color:var(--pine);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--pine)}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
code{font-family:var(--mono);font-size:.9em;background:var(--pine-faint);border:1px solid var(--line);border-radius:4px;padding:.08em .38em;white-space:nowrap}
strong{font-weight:650}
p{margin:10px 0;max-width:74em}

/* 无障碍与侧边导航 */
.skip-link{position:fixed;left:18px;top:12px;z-index:100;transform:translateY(-150%);padding:8px 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px}
.skip-link:focus{transform:translateY(0)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sidebar{
  position:fixed;inset:0 auto 0 0;z-index:30;width:var(--sidebar-w);
  display:flex;flex-direction:column;padding:24px 18px 18px;
  color:#e7f0ec;background:linear-gradient(180deg,#173a32 0%,#112b25 100%);
  border-right:1px solid rgba(255,255,255,.1);box-shadow:16px 0 50px rgba(17,43,37,.12);
}
.side-brand{padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.12)}
.side-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.19em;color:#9fc3b6}
.side-title{font-family:var(--song);font-size:21px;font-weight:700;line-height:1.35;margin-top:8px}
.side-review{
  display:inline-flex;align-items:center;gap:7px;margin-top:13px;padding:4px 9px;
  border:1px solid rgba(255,255,255,.18);border-radius:99px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#d9e8e2;background:rgba(255,255,255,.06);
}
.side-review::before{content:"";width:6px;height:6px;border-radius:50%;background:#e5b95e;box-shadow:0 0 0 4px rgba(229,185,94,.12)}
.side-nav{overflow:auto;scrollbar-width:thin;padding:18px 4px 12px}
.side-group{margin:14px 8px 7px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:#789f92;text-transform:uppercase}
.side-group:first-child{margin-top:0}
.side-nav a{
  position:relative;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;
  min-height:38px;padding:7px 9px;margin:2px 0;border:0;border-radius:9px;
  color:#c9dcd5;font-size:12.5px;line-height:1.35;
}
.side-nav a:hover{color:#fff;background:rgba(255,255,255,.07);border:0}
.side-nav a .n{font-family:var(--mono);font-size:10px;color:#7fb09f}
.side-nav a::after{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:3px;background:transparent}
.side-nav a.active,.side-nav a[aria-current="true"]{color:#fff;background:rgba(255,255,255,.1)}
.side-nav a.active .n,.side-nav a[aria-current="true"] .n{color:#a8d8c7}
.side-nav a.active::after,.side-nav a[aria-current="true"]::after{background:#76c2a8}
.side-bottom{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.12)}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.side-actions button{
  appearance:none;border:1px solid rgba(255,255,255,.15);border-radius:8px;
  background:rgba(255,255,255,.04);color:#cfe1da;padding:7px 5px;font:11px var(--sans);cursor:pointer;
}
.side-actions button:hover{background:rgba(255,255,255,.1);color:#fff}
.progress-copy{display:flex;justify-content:space-between;margin-top:13px;font:10px var(--mono);color:#88aa9e}
.progress-track{height:3px;margin-top:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.progress-bar{display:block;width:0;height:100%;background:#76c2a8;transition:width .12s linear}
.page{min-width:0;margin-left:var(--sidebar-w)}
.wrap{max-width:1220px;margin:0 auto;padding:42px 48px 90px}

/* 文件头 */
.tblock{
  position:relative;overflow:hidden;border:1px solid rgba(26,36,32,.7);border-radius:18px;
  box-shadow:var(--shadow);background:rgba(252,253,253,.96);
}
.tb-top{display:grid;grid-template-columns:1fr 248px;border-bottom:1px solid var(--line-strong);background:linear-gradient(135deg,rgba(238,244,241,.98),rgba(252,253,253,.95) 62%)}
.tb-name{padding:38px 38px 32px}
.tb-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--ink2);margin-bottom:14px}
.tb-name h1{font-family:var(--song);font-size:31px;font-weight:700;line-height:1.35;letter-spacing:.02em;max-width:760px}
.tb-name .sub{margin-top:10px;color:var(--ink2);font-size:14.5px;max-width:60em}
.tb-meta{border-left:1px solid var(--line-strong);display:flex;flex-direction:column}
.tb-meta div{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px}
.tb-meta div:last-child{border-bottom:none}
.tb-meta b{font-family:var(--mono);font-weight:400;color:var(--ink2);letter-spacing:.08em}
.tb-meta span{font-family:var(--mono);font-size:12px}
.tb-meta .vtag{color:var(--seal);font-weight:700}
.tb-sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));background:rgba(255,255,255,.48)}
.tb-sign section{padding:12px 12px 14px;border-right:1px solid var(--line)}
.tb-sign section:last-child{border-right:none}
.tb-sign .role{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--pine);font-weight:700}
.tb-sign .who{font-size:11.5px;color:var(--ink2);margin-top:2px}
.tb-sign .line{margin-top:15px;border-bottom:1px dotted var(--ink2);height:1px}
.tb-sign .hint{font-family:var(--mono);font-size:9.5px;color:var(--ink2);margin-top:4px;letter-spacing:.06em}
.stamp{position:absolute;right:25px;top:-20px;width:98px;height:98px;border:3px solid var(--seal);border-radius:50%;color:var(--seal);transform:rotate(-8deg);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.72;mix-blend-mode:multiply;background:rgba(255,255,255,.25)}
.stamp::after{content:"";position:absolute;inset:5px;border:1px solid var(--seal);border-radius:50%}
.stamp .s1{font-family:var(--song);font-size:24px;font-weight:700;letter-spacing:.08em;line-height:1}
.stamp .s2{font-size:10px;letter-spacing:.18em;margin-top:5px}
.stamp .s3{font-family:var(--mono);font-size:9px;letter-spacing:.1em;margin-top:2px}

/* 评审综述块（TL;DR） */
.changes{
  margin:18px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:24px 28px 23px;box-shadow:var(--shadow-soft);
}
.changes h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink2);font-weight:600;margin:0 0 10px}
.changes p{font-size:13.5px;margin:0 0 10px}
.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.review-card{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.review-card strong{display:block;margin-bottom:4px;font:700 11px var(--mono);letter-spacing:.09em}
.review-card p{margin:0;font-size:12.5px;line-height:1.65;color:var(--ink2)}
.review-card.stable{border-top:3px solid var(--pine)}
.review-card.stable strong{color:var(--pine)}
.review-card.conditional{border-top:3px solid var(--amber)}
.review-card.conditional strong{color:var(--amber)}
.review-card.blocked{border-top:3px solid var(--seal)}
.review-card.blocked strong{color:var(--seal)}

/* 章节 */
.sec{
  scroll-margin-top:28px;margin-top:34px;padding:26px 30px 30px;
  border:1px solid var(--line);border-top:3px solid var(--pine);border-radius:15px;
  background:rgba(252,253,253,.94);box-shadow:var(--shadow-soft);
}
.sec>h2{
  display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;margin:-3px 0 0;
  font-family:var(--song);font-size:26px;font-weight:700;letter-spacing:.03em;
}
.sec>h2 .no{
  display:inline-flex;align-items:center;height:28px;padding:0 9px;border-radius:7px;
  font-size:12px;color:var(--pine);font-family:var(--mono);font-weight:600;letter-spacing:.08em;background:var(--pine-soft);
}
.sec>.lede{color:var(--ink2);font-size:14px;margin-top:8px;max-width:68em}
.section-toggle{
  appearance:none;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink2);padding:6px 9px;font:11px var(--sans);cursor:pointer;
}
.section-toggle:hover{color:var(--pine);border-color:var(--pine)}
.sec.is-collapsed{padding-bottom:26px}
.sec.is-collapsed>:not(h2){display:none}
h3{font-family:var(--song);font-size:18px;font-weight:700;margin:34px 0 10px;letter-spacing:.02em;scroll-margin-top:30px}
h3 .h3no{color:var(--pine);font-family:var(--mono);font-size:13px;margin-right:8px}
h4{font-size:14.5px;margin:18px 0 6px}
ul.plain,ol.plain{margin:8px 0 8px 24px}
ul.plain li,ol.plain li{margin:6px 0}

/* 模块/概念卡片 */
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:18px}
.defs .card{min-width:0;background:var(--card);border:1px solid var(--line);border-top:2px solid var(--pine);border-radius:11px;padding:12px 12px 11px;box-shadow:0 3px 12px rgba(28,55,45,.035)}
.defs .card.runtime{border-top-color:var(--blue)}
.defs .abbr{font-family:var(--song);font-size:20px;font-weight:700;color:var(--pine);letter-spacing:.05em}
.defs .runtime .abbr{color:var(--blue)}
.defs .full{display:block;overflow-wrap:anywhere;font-family:var(--mono);font-size:8.7px;color:var(--ink2);letter-spacing:.09em;margin-top:1px}
.defs .cn{font-size:13px;font-weight:700;margin-top:7px}
.defs .pos{display:block;width:max-content;max-width:100%;font-family:var(--mono);font-size:9px;border:1px solid var(--pine);color:var(--pine);border-radius:3px;padding:0 6px;margin-top:5px;letter-spacing:.07em}
.defs .runtime .pos{border-color:var(--blue);color:var(--blue)}
.defs .card p{font-size:11.7px;color:var(--ink2);margin:7px 0 0;line-height:1.58}
.defs .card p b{color:var(--ink)}

/* 编号条目（决策清单用） */
.prin{margin-top:20px;display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.prin article{display:grid;grid-template-columns:64px 1fr;border-bottom:1px solid var(--line)}
.prin article:last-child{border-bottom:none}
.prin .pno{font-family:var(--song);font-size:21px;font-weight:700;color:var(--pine);display:flex;align-items:flex-start;justify-content:center;padding:16px 0;border-right:1px solid var(--line);background:var(--pine-faint)}
.prin .pbody{padding:14px 20px 15px}
.prin .pbody h4{font-size:15px;font-weight:700;margin:0}
.prin .pbody p{font-size:13.5px;color:var(--ink2);margin:5px 0 0}
.prin .pbody p b{color:var(--ink)}
.src{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.06em;margin-left:8px;white-space:nowrap}

/* 表格 */
.twrap{overflow-x:auto;overflow-y:hidden;margin:16px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 3px 14px rgba(28,55,45,.035)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:600;text-align:left;color:var(--ink2);background:#edf4f1;padding:9px 13px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.68}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:rgba(238,244,241,.26)}
tbody tr:hover{background:#e8f2ed}
.iftag{font-family:var(--mono);font-weight:700;color:var(--pine);white-space:nowrap}
.muted{color:var(--ink2)}

/* 徽章与提示 */
.b{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;font-weight:700;border:1px solid;border-radius:3px;padding:1px 7px;vertical-align:1px;white-space:nowrap}
.b-k{color:var(--pine);border-color:var(--pine);background:#fff}
.b-r{color:var(--amber);border-color:var(--amber);background:#fff}
.b-g{color:var(--ink2);border-color:var(--ink2);background:#fff}
.b-c{color:var(--blue);border-color:var(--blue);background:#fff}
.callout{border-left:3px solid var(--pine);background:var(--pine-soft);border-radius:0 9px 9px 0;padding:12px 18px;margin:18px 0;font-size:13.5px;max-width:74em}
.callout.warn{border-left-color:var(--seal);background:var(--seal-soft)}
.callout.amber{border-left-color:var(--amber);background:var(--amber-soft)}
.callout.blue{border-left-color:var(--blue);background:var(--blue-soft)}
.callout b:first-child{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;display:block;margin-bottom:4px;color:var(--pine)}
.callout.warn b:first-child{color:var(--seal)}
.callout.amber b:first-child{color:var(--amber)}
.callout.blue b:first-child{color:var(--blue)}

/* 名词表与时间线 */
.term{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);padding:12px 16px;margin:12px 0}
.term dt{font-weight:700}
.term dd{margin:3px 0 10px;color:var(--ink2);font-size:13.5px}
.term dd:last-child{margin-bottom:0}
.timeline{list-style:none;margin:18px 0 6px;border-left:2px solid var(--line)}
.timeline li{position:relative;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:9px 0 9px 26px}
.timeline li::before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--pine)}
.timeline li.risk::before{border-color:var(--seal)}
.timeline .step{font-size:13.5px}
.timeline .actor{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);margin-right:8px;white-space:nowrap}
.timeline .lat{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.seqcap{font-family:var(--song);font-size:16px;font-weight:700;margin:30px 0 4px}

/* 代码与图 */
pre{background:var(--code-bg);color:var(--code-tx);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:18px 20px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.62;margin:14px 0;max-width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
pre code{font-size:inherit;background:none;border:0;border-radius:0;padding:0;white-space:pre;color:inherit}
.codecap{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink2);margin:18px 0 -8px}
.flowviz{margin:18px 0 26px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px 20px 14px;overflow-x:auto;box-shadow:0 4px 18px rgba(28,55,45,.045)}
.flowviz svg{display:block;min-width:760px;width:100%;height:auto}
.flowviz figcaption{font-size:12.5px;color:var(--ink2);margin-top:10px}
.flowviz svg text{font-family:inherit}

footer{margin-top:38px;border-top:2px solid var(--line-strong);padding:18px 4px 0;display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.06em;flex-wrap:wrap}
.sidebar-toggle,.sidebar-overlay,.to-top{display:none}

@media(max-width:1180px) and (min-width:901px){
  :root{--sidebar-w:244px}
  .sidebar{padding-left:13px;padding-right:13px}
  .wrap{padding-left:30px;padding-right:30px}
  .side-title{font-size:18px}
  .tb-name h1{font-size:29px}
}
@media(max-width:900px){
  :root{--sidebar-w:min(310px,86vw)}
  .sidebar{transform:translateX(-105%);transition:transform .22s ease}
  body.nav-open .sidebar{transform:translateX(0)}
  .page{margin-left:0}
  .wrap{padding:72px 18px 62px}
  .sidebar-toggle{
    position:fixed;left:14px;top:14px;z-index:42;display:inline-flex;align-items:center;gap:8px;
    min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;
    background:rgba(252,253,253,.94);box-shadow:var(--shadow-soft);color:var(--ink);
    font:12px var(--sans);cursor:pointer;backdrop-filter:blur(10px);
  }
  .sidebar-toggle::before{content:"☰";font-size:16px;color:var(--pine)}
  body.nav-open .sidebar-toggle{left:calc(var(--sidebar-w) + 10px)}
  .sidebar-overlay{position:fixed;inset:0;z-index:25;background:rgba(12,28,23,.46)}
  body.nav-open .sidebar-overlay{display:block}
  .tb-top{grid-template-columns:1fr}
  .tb-meta{border-left:none;border-top:1px solid var(--line-strong);display:grid;grid-template-columns:1fr 1fr}
  .tb-meta div{border-right:0}
  .tb-name{padding:34px 24px 27px}
  .tb-name h1{font-size:28px}
  .stamp{width:86px;height:86px;top:-14px;right:10px}
  .stamp .s1{font-size:19px}
  .changes{padding:21px 21px}
  .review-grid{grid-template-columns:1fr}
  .sec{padding:22px 20px 24px}
  .sec>h2{font-size:23px}
  .to-top{
    position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;justify-content:center;
    width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff;
    box-shadow:var(--shadow-soft);color:var(--pine);font-size:18px;cursor:pointer;
    opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s ease;
  }
  .to-top.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
}
@media(max-width:600px){
  body{font-size:14px}
  .wrap{padding-left:12px;padding-right:12px}
  .tblock,.changes,.sec{border-radius:12px}
  .tb-meta{grid-template-columns:1fr}
  .stamp{width:75px;height:75px;top:-10px;right:8px}
  .stamp .s1{font-size:17px}
  .sec{padding:20px 15px 22px}
  .sec>h2{grid-template-columns:auto 1fr;font-size:21px;line-height:1.35}
  .section-toggle{grid-column:1/-1;justify-self:start}
  .defs{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  .sidebar,.to-top,.progress-bar{transition:none}
}
@media print{
  body{background:#fff}
  .stamp{mix-blend-mode:normal}
  .sidebar,.sidebar-toggle,.sidebar-overlay,.to-top,.section-toggle{display:none!important}
  .page{margin-left:0}
  .wrap{max-width:none;padding:0}
  .sec{box-shadow:none;break-inside:auto}
  .sec.is-collapsed>:not(h2){display:block}
  .callout{break-inside:avoid}
  th{position:static}
}
</style>
</head>
<body>
<a class="skip-link" href="#main-content">跳到正文</a>
<button class="sidebar-toggle" type="button" aria-controls="doc-sidebar" aria-expanded="false">章节目录</button>
<button class="sidebar-overlay" type="button"><span class="visually-hidden">关闭章节目录</span></button>

<aside class="sidebar" id="doc-sidebar" aria-label="文档章节导航">
  <div class="side-brand">

<script>
(() => {
  const body = document.body;
  const sidebarToggle = document.querySelector('.sidebar-toggle');
  const sidebarOverlay = document.querySelector('.sidebar-overlay');
  const navLinks = [...document.querySelectorAll('.side-nav a')];
  const sections = [...document.querySelectorAll('.sec')];
  const progressBar = document.querySelector('.progress-bar');
  const progressValue = document.querySelector('.progress-value');
  const toTop = document.querySelector('.to-top');

  const setNavOpen = (open) => {
    body.classList.toggle('nav-open', open);
    sidebarToggle.setAttribute('aria-expanded', String(open));
  };
  sidebarToggle.addEventListener('click', () => setNavOpen(!body.classList.contains('nav-open')));
  sidebarOverlay.addEventListener('click', () => setNavOpen(false));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') setNavOpen(false);
  });
  navLinks.forEach((link) => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 900) setNavOpen(false);
    });
  });

  sections.forEach((section) => {
    const heading = section.querySelector(':scope > h2');
    if (!heading) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'section-toggle';
    button.textContent = '收起本节';
    button.setAttribute('aria-expanded', 'true');
    button.addEventListener('click', () => {
      const collapsed = section.classList.toggle('is-collapsed');
      button.textContent = collapsed ? '展开本节' : '收起本节';
      button.setAttribute('aria-expanded', String(!collapsed));
    });
    heading.appendChild(button);
  });

  const setAllSections = (collapsed) => {
    sections.forEach((section) => {
      section.classList.toggle('is-collapsed', collapsed);
      const button = section.querySelector('.section-toggle');
      if (button) {
        button.textContent = collapsed ? '展开本节' : '收起本节';
        button.setAttribute('aria-expanded', String(!collapsed));
      }
    });
  };
  document.querySelector('[data-action="expand"]').addEventListener('click', () => setAllSections(false));
  document.querySelector('[data-action="collapse"]').addEventListener('click', () => setAllSections(true));

  const setActive = (id) => {
    navLinks.forEach((link) => {
      const active = link.getAttribute('href') === `#${id}`;
      link.classList.toggle('active', active);
      if (active) {
        link.setAttribute('aria-current', 'true');
        link.scrollIntoView({block:'nearest'});
      } else {
        link.removeAttribute('aria-current');
      }
    });
  };
  const observer = new IntersectionObserver((entries) => {
    const visible = entries
      .filter((entry) => entry.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (visible[0]) setActive(visible[0].target.id);
  }, {rootMargin:'-12% 0px -72% 0px', threshold:0});
  sections.forEach((section) => observer.observe(section));

  let ticking = false;
  const updateProgress = () => {
    const root = document.documentElement;
    const max = Math.max(1, root.scrollHeight - window.innerHeight);
    const percent = Math.min(100, Math.max(0, Math.round((window.scrollY / max) * 100)));
    progressBar.style.width = `${percent}%`;
    progressValue.textContent = `${percent}%`;
    toTop.classList.toggle('visible', window.scrollY > 720);
    ticking = false;
  };
  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(updateProgress);
      ticking = true;
    }
  }, {passive:true});
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900) setNavOpen(false);
    updateProgress();
  });
  toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
  updateProgress();
  if (sections[0]) setActive(sections[0].id);
})();
</script>
