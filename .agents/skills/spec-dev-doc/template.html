<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfcfb"><title><!-- FILL:title --><!-- /FILL:title --></title>
<style>

:root{--paper:#f4f6f5;--card:#fcfdfd;--ink:#1a2420;--ink2:#54645d;
--line:#ccd6d1;--pine:#1e5c4f;--pine-soft:#e4efea;--pine-faint:#eef4f1;
--seal:#b3372b;--seal-soft:#f6e9e6;--amber:#8a6317;--amber-soft:#f4edda;
--blue:#415f86;--blue-soft:#e8eef6;--mint:#62b795;--deep1:#173a32;--deep2:#112b25;
--code-bg:#152019;--code-tx:#d9e4de;
--song:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
--sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--nav:300px;--sheet-max:1420px}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}
body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.9 var(--sans);
text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.skip{position:fixed;z-index:99;top:10px;left:12px;transform:translateY(-160%);padding:8px 14px;border-radius:4px;background:var(--ink);color:#fff;text-decoration:none}
.skip:focus{transform:none}
nav{position:fixed;inset:0 auto 0 0;z-index:30;display:flex;flex-direction:column;width:var(--nav);
padding:30px 20px 16px;color:var(--ink);background:#fbfcfb;border-right:1px solid var(--line)}
.brand{padding:2px 8px 18px;border-bottom:2px solid var(--ink)}
.kicker{margin:0 0 12px;color:var(--amber);font:600 10px/1 var(--mono);letter-spacing:.28em}
.title{margin:0;font:700 20px/1.5 var(--song);letter-spacing:.02em;color:var(--ink)}
.vtag{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:3px 12px;border:1px solid var(--pine);border-radius:99px;color:var(--pine);font:600 10.5px/1.6 var(--mono);letter-spacing:.08em}
.vtag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pine)}
.bmeta{margin:9px 0 0;color:var(--ink2);font:500 10px/1.6 var(--mono);letter-spacing:.08em}
.toc{flex:1;overflow:auto;margin:4px -8px 0;padding:0 8px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.group{margin:22px 8px 6px;color:var(--amber);font:600 10px/1.4 var(--sans);letter-spacing:.22em}
nav a{display:grid;grid-template-columns:26px 1fr;gap:9px;margin:1px 0;padding:6px 10px;border-left:2px solid transparent;border-radius:0 4px 4px 0;color:var(--ink2);text-decoration:none;font-size:13px;line-height:1.5;transition:background .15s,color .15s}
nav a:hover{background:var(--pine-faint);color:var(--pine)}
nav a.active{border-left-color:var(--pine);background:var(--pine-soft);color:var(--pine);font-weight:600}
.n{color:#8fa09a;font:600 10px/1.7 var(--mono)}
.subs{display:none;margin:1px 0 7px 20px;border-left:1px solid var(--line)}
nav a.active+.subs{display:block}
nav a.sub{grid-template-columns:32px 1fr;gap:6px;margin:0;padding:3px 8px 3px 10px;border-radius:0;font-size:12px;line-height:1.55;color:#7d8d85}
nav a.sub:hover{color:var(--pine);background:var(--pine-faint)}
nav a.sub.on{border-left-color:var(--pine);color:var(--pine);font-weight:500}
.sn{font:500 10px/1.9 var(--mono);color:#9aa9a2}
nav a.sub.on .sn,nav a.sub:hover .sn{color:inherit}
.navfoot{padding:12px 8px 0;border-top:1px solid var(--line);color:var(--ink2);font:500 10px/1.6 var(--mono);letter-spacing:.08em}
.bar{height:3px;margin-top:7px;border-radius:2px;background:#e6ebe7;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pine)}
main{margin-left:var(--nav);width:calc(100% - var(--nav));padding:46px 36px 140px}
.sheet{position:relative;max-width:var(--sheet-max);margin:0 auto 48px;padding:50px 52px 58px;border:1px solid var(--line);border-top:4px solid var(--pine);border-radius:4px;background:var(--card);box-shadow:0 22px 54px #112b2514}
.sheet::after{content:"";position:absolute;top:-4px;left:0;width:92px;height:4px;background:#c8a24a}
.head{display:grid;grid-template-columns:70px 1fr auto;gap:18px;align-items:end;margin-bottom:6px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.no{color:var(--pine);font:500 46px/.85 var(--song);letter-spacing:-.02em}
.head h1{margin:0;font:700 27px/1.35 var(--song);letter-spacing:.03em;text-wrap:balance}
.kind{align-self:center;padding:3px 12px;border:1px solid var(--pine);border-radius:99px;color:var(--pine);font:600 10px/1.7 var(--sans);letter-spacing:.16em;white-space:nowrap}
.headtools{display:flex;align-items:center;justify-content:flex-end;gap:12px;align-self:center;white-space:nowrap}
.lede{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;margin:0 0 26px;padding:13px 18px;border-left:4px solid #c8a24a;border-radius:0 4px 4px 0;background:var(--pine-faint)}
.lede::before{content:"导读";color:var(--amber);font:700 11px/2 var(--sans);letter-spacing:.3em;white-space:nowrap}
.lede p{margin:0;max-width:none;font-size:16px;line-height:1.9}
.lede p+p{margin-top:8px}
h2{position:relative;margin:38px 0 14px;padding:0 0 8px;border-bottom:1px solid var(--line);font:700 19px/1.5 var(--song)}
.h2no{margin-right:12px;color:var(--pine);font:600 13px/1 var(--mono);letter-spacing:.04em}
h3{margin:30px 0 10px;color:var(--pine);font-size:15.5px}
p{margin:10px 0}.sheet>p,.sheet>ul,.sheet>ol{max-width:none}strong{color:var(--ink)}
a{color:var(--pine)}
.table{max-width:100%;margin:20px 0 28px;overflow-x:auto;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
table{width:100%;min-width:680px;border-collapse:collapse;table-layout:auto;font-size:13.5px;line-height:1.75;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border:1px solid #dee6e1}
th{background:var(--pine-soft);color:var(--pine);font-size:11px;letter-spacing:.08em}
tbody tr:nth-child(even){background:var(--pine-faint)}
code{padding:2px 5px;border:1px solid #dfe6e0;border-radius:3px;background:var(--pine-faint);color:var(--pine);font:12.3px/1.5 var(--mono)}
pre{position:relative;overflow:auto;padding:18px 22px;border-left:4px solid var(--pine);border-radius:0 4px 4px 0;background:var(--code-bg);color:var(--code-tx)}
pre[data-lang]{padding-top:30px}
pre[data-lang]::before{content:attr(data-lang);position:absolute;top:9px;right:13px;color:#7e948b;font:700 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}
pre code{border:0;background:none;color:inherit}
.fig{margin:22px 0 26px;padding:18px 14px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.cap{max-width:none;margin:12px auto 0;text-align:center;color:var(--ink2);font-size:11px;letter-spacing:.08em}
.cap b{color:var(--pine);font-family:var(--mono);font-weight:600;letter-spacing:.04em}
.callout{position:relative;margin:20px 0;padding:13px 18px 13px 20px;border:1px solid var(--line);border-left:4px solid var(--pine);border-radius:0 4px 4px 0;background:var(--pine-faint);font-size:13.6px;line-height:1.85;max-width:none}
.callout::before{display:block;margin-bottom:2px;font:700 10.5px/1.8 var(--sans);letter-spacing:.26em}
.callout.decision{border-left-color:var(--pine)}
.callout.decision::before{content:"已决定";color:var(--pine)}
.callout.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.callout.warn::before{content:"易错边界";color:var(--amber)}
.callout.redline{border-left-color:var(--seal);background:var(--seal-soft)}
.callout.redline::before{content:"红线";color:var(--seal)}
.callout.faq{border-left-color:var(--blue);background:var(--blue-soft)}
.callout.faq::before{content:"为什么";color:var(--blue)}
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:24px 0 30px}
.verdict{padding:15px 18px;border:1px solid var(--line);border-top:3px solid var(--pine);border-radius:4px;background:var(--card);font-size:13.4px;line-height:1.8}
.verdict::before{display:block;margin-bottom:6px;font:700 11px/1.6 var(--mono);letter-spacing:.18em}
.verdict.keep{border-top-color:var(--pine)}.verdict.keep::before{content:"RETAINED · 边界未变";color:var(--pine)}
.verdict.revise{border-top-color:var(--amber)}.verdict.revise::before{content:"REVISED · 已修订";color:var(--amber)}
.verdict.review{border-top-color:var(--seal)}.verdict.review::before{content:"REVIEW REQUIRED · 待复核";color:var(--seal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;margin:22px 0 28px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--line)}
.stat{padding:14px 16px 12px;background:var(--card)}
.stat b{display:block;color:var(--pine);font:600 22px/1.3 var(--mono)}
.stat span{color:var(--ink2);font-size:11px;letter-spacing:.06em}
.stat i{margin-left:6px;font-style:normal;color:var(--amber);font-size:10px}
mark{background:#f2e3ae;padding:0 3px;border-radius:2px;color:inherit}
.ids{margin:14px 0 -8px;color:var(--ink2);font-size:11.5px;letter-spacing:.02em}
.ids b{color:var(--pine);font-family:var(--mono);font-weight:600}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 26px}
.quick-card{position:relative;padding:18px 20px;border:1px solid var(--line);border-radius:6px;background:#fff}
.quick-card{padding-left:58px}
.quick-card .step{position:absolute;top:18px;left:18px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pine);color:#fff;font:700 12px/1 var(--mono)}
.quick-card h3{margin:0 0 6px;color:var(--ink);font:700 15px/1.5 var(--sans)}
.quick-card p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.75}
.statuskey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:18px 0 26px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--line)}
.statuskey div{padding:13px 14px;background:#fff}
.statuskey b{display:block;margin-bottom:3px;font-size:12px}
.statuskey span{display:block;color:var(--ink2);font-size:12px;line-height:1.6}
.statuskey .done b{color:var(--pine)}.statuskey .build b{color:var(--blue)}.statuskey .later b{color:var(--amber)}.statuskey .open b{color:var(--seal)}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 28px}
.term{padding:12px 14px;border-left:3px solid var(--line);background:var(--pine-faint);font-size:12.5px;line-height:1.7}
.term b{display:block;color:var(--pine);font-family:var(--mono)}
.plainflow{display:flex;align-items:stretch;gap:8px;margin:18px 0 24px}
.plainflow>div{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12.5px;line-height:1.65}
.plainflow>span{align-self:center;color:var(--pine);font:700 16px/1 var(--mono)}
.mechanism-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.mechanism-card{padding:14px 16px;border-top:3px solid var(--pine);border-radius:4px;background:var(--pine-faint);font-size:12.8px;line-height:1.7}
.mechanism-card b{display:block;margin-bottom:4px;color:var(--pine);font-size:13px}
@media (max-width:1180px){nav{display:none}main{margin:0;width:100%;padding:18px 14px 90px}
.sheet{padding:26px 20px 30px}
.head{grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}.head .kind{display:none}.headtools{grid-column:auto;justify-content:flex-end}.no{font-size:34px}
.mechanism-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.quick-grid{grid-template-columns:1fr}.statuskey{grid-template-columns:repeat(2,minmax(0,1fr))}.terms{grid-template-columns:1fr 1fr}.plainflow{display:grid;grid-template-columns:1fr}.plainflow>span{transform:rotate(90deg);justify-self:center}}
@media (max-width:560px){.statuskey,.terms,.mechanism-grid{grid-template-columns:1fr}.head{gap:8px}.head h1{font-size:21px}.no{font-size:30px}.foldctl span{display:none}.foldctl button{padding:3px 7px;font-size:9.5px}}
@media print{@page{size:A4;margin:16mm}nav{display:none}main{margin:0;width:auto;padding:0}
.sheet{break-before:page;margin:0;padding:0 0 24px;border:0;box-shadow:none}.sheet::after{display:none}
.sheet:first-child{break-before:auto}table{min-width:0;font-size:9.5px}h2,h3{break-after:avoid}
.fig,table,pre,.callout,.stat,.verdict,.quick-card,.statuskey,.term,.plainflow{break-inside:avoid}}
@media print{.foldctl{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

details.deep{margin:8px 0 16px}
details.deep>summary{cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border:1px solid var(--pine);border-radius:99px;color:var(--pine);background:var(--pine-faint);font:600 11px/1.7 var(--sans);letter-spacing:.04em;user-select:none;list-style:none}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary::before{content:"\25B8  ";font-size:10px}
details.deep[open]>summary::before{content:"\25BE  "}
details.deep[open]>summary{border-radius:10px 10px 0 0;background:var(--pine-soft)}
details.deep>.dbody{margin-top:-1px;padding:6px 18px 10px;border:1px solid var(--line);border-radius:0 10px 10px 10px;background:var(--card)}
.flowsteps{display:grid;gap:8px;margin:18px 0 28px}
details.flowstep{margin:0}
details.flowstep>summary{display:grid;grid-template-columns:auto minmax(0,1fr);width:100%;gap:10px;padding:11px 15px;border-radius:6px;background:#fff;font-size:13.5px;line-height:1.65;letter-spacing:0}
details.flowstep>summary::before{align-self:center;color:var(--pine);font-size:12px}
details.flowstep>summary strong{display:block;color:var(--ink);font-size:14px}
details.flowstep>summary small{display:block;margin-top:2px;color:var(--ink2);font-size:12.5px;font-weight:400}
details.flowstep[open]>summary{border-radius:6px 6px 0 0}
details.flowstep>.dbody{margin-top:-1px;border-radius:0 0 6px 6px}
.foldctl{display:inline-flex;align-items:center;gap:5px;margin:0}
.foldctl span{margin-right:2px;color:var(--ink2);font:600 10px/1.6 var(--sans);letter-spacing:.08em}
.foldctl button{flex:none;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink2);font:600 10.5px/1.6 var(--sans);cursor:pointer}
.foldctl button:hover{color:var(--pine);border-color:var(--pine)}

/* 四色语义徽标（项目规范：结论性内容一眼分轻重；只此一套，不另造颜色措辞） */
.b{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:99px;
   font:600 10.5px/1.7 var(--sans);letter-spacing:.08em;white-space:nowrap;vertical-align:1px}
.b-pin{background:var(--pine-soft);color:var(--pine)}
.b-must{background:var(--seal-soft);color:var(--seal)}
.b-later{background:var(--blue-soft);color:var(--blue)}
.b-test{background:var(--amber-soft);color:var(--amber)}
.b-g{background:#eef0ef;color:var(--ink2)}



/* HTML/CSS 盒子图（diagram.md §一；架构图与流程图的默认画法） */
.dgm{margin:18px 0 26px;padding:18px 20px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.dgm .lane{margin:0 0 10px;padding:10px 12px 12px;border-radius:8px;background:var(--pine-faint)}
.dgm .lane:last-of-type{margin-bottom:0}
.dgm .lane>h4{margin:0 0 8px;font:600 10px/1 var(--mono);letter-spacing:.18em;color:var(--amber)}
.dgm .row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.dgm .row+.row{margin-top:10px}
.dgm .bx{flex:1 1 150px;min-width:130px;padding:9px 12px;border:1.2px solid var(--ink);border-radius:6px;background:var(--card)}
.dgm .bx b{display:block;font:600 12.5px/1.5 var(--sans);color:var(--ink)}
.dgm .bx span{display:block;font:11px/1.5 var(--sans);color:var(--ink2)}
.dgm .bx.fit{flex:0 1 auto;width:auto;min-width:110px;max-width:210px}
.dgm .bx .no{display:inline-grid;place-items:center;width:16px;height:16px;margin-right:5px;border-radius:50%;background:var(--pine);color:#fcfdfd;font:600 9.5px/1 var(--mono);font-style:normal;vertical-align:1.5px}
.dgm .bx.ext .no{background:var(--blue)}
.dgm .bx.warn .no{background:var(--amber)}
.dgm .down>span .no,.dgm .up>span .no{width:15px;height:15px;font-size:9px;margin-right:4px}
.dgm .bx.new{border-color:var(--pine);background:var(--pine-soft)}
.dgm .bx.ext{border-color:var(--blue);background:var(--blue-soft)}
.dgm .bx.warn{border-color:var(--amber);background:var(--amber-soft)}
.dgm .flow{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.dgm .step{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:11.5px;color:var(--ink)}
.dgm .step i{font:600 10px/1 var(--mono);color:var(--pine);font-style:normal}
.dgm .step.alt{border-color:var(--amber);background:var(--amber-soft)}
.dgm .arrow{color:var(--ink2);font-size:15px;line-height:1}
.dgm .note{margin:10px 0 0;font-size:11.5px;line-height:1.7;color:var(--ink2)}
/* 连线（diagram.md §一）：连接符是真元素（内联 SVG），线与箭头一笔画成。
   不用 CSS 伪元素三角形——那种做法在换行时会留下指向空处的半截箭头。 */
.dgm .chain{display:flex;flex-wrap:nowrap;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:2px}
.dgm .chain>.bx{flex:1 1 0;min-width:112px}
.dgm .conn{flex:0 0 30px;align-self:center;height:18px;display:block}
.dgm .conn path{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dgm .conn .l{stroke:var(--ink2)}
.dgm .conn.async .l{stroke-dasharray:4 3}
.dgm .down,.dgm .up{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.dgm .down>svg,.dgm .up>svg{flex:0 0 24px;height:30px}
.dgm .down path,.dgm .up path{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dgm .down.async .l,.dgm .up.async .l{stroke-dasharray:4 3}
.dgm .down>span,.dgm .up>span{padding:3px 12px;background:var(--card);border:1px solid var(--line);border-radius:99px;
  font-size:11.5px;color:var(--ink);line-height:1.6}
.dgm .down.async>span,.dgm .up.async>span{border-color:var(--amber);background:var(--amber-soft);color:#5c4310}
@media(max-width:820px){.dgm .bx{flex:1 1 100%}}

/* 图容器：mermaid 预渲染 SVG 与图下说明（diagram.md §二 依赖，勿删） */
.flowviz{margin:18px 0 26px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px 20px 14px;overflow-x:auto;box-shadow:0 4px 18px rgba(28,55,45,.045)}
.flowviz svg{display:block;max-width:none;height:auto;margin:0 auto}
.flowviz figcaption{font-size:12.5px;color:var(--ink2);margin-top:10px}
.flowviz svg text{font-family:inherit}
.flowviz .cap{margin:8px 0 0;text-align:left;font-size:12px;line-height:1.7;letter-spacing:0}

/* 图例条：线型含义（diagram.md §三点三 依赖，勿删） */
.fig-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.fig-legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--ink2);margin-right:5px;vertical-align:3px}
.fig-legend i.d{border-top-style:dashed}
.fig-legend i.b{width:13px;height:11px;border:1.2px solid var(--ink);border-radius:3px;background:var(--card);vertical-align:-1px}
.fig-legend i.b.new{border-color:var(--pine);background:var(--pine-soft)}
.fig-legend i.b.ext{border-color:var(--blue);background:var(--blue-soft)}
.fig-legend i.b.warn{border-color:var(--amber);background:var(--amber-soft)}
.fig-legend i.n{width:14px;height:14px;border:0;border-radius:50%;background:var(--pine);vertical-align:-2px}


</style></head><body><a class="skip" href="#content">跳到正文</a>

<!-- FILL:side-brand

<script>

const fill=document.getElementById('fill'),pct=document.getElementById('pct');
if(fill&&pct)addEventListener('scroll',()=>{const h=document.documentElement;const p=Math.min(100,Math.round(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)||0);fill.style.width=p+'%';pct.textContent=p+'%'},{passive:true});
const links=[...document.querySelectorAll('nav a:not(.sub)')],sheets=[...document.querySelectorAll('.sheet[id]')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(x=>x.classList.remove('active'));document.querySelector(`nav a[href="#${e.target.id}"]`)?.classList.add('active')}}),{rootMargin:'-12% 0px -78%'});
sheets.forEach(s=>io.observe(s));
const subs=[...document.querySelectorAll('nav a.sub')],heads=[...document.querySelectorAll('main h2[id]')];
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){subs.forEach(x=>x.classList.remove('on'));document.querySelector(`nav a.sub[href="#${e.target.id}"]`)?.classList.add('on')}}),{rootMargin:'-8% 0px -80%'});
heads.forEach(h=>io2.observe(h));

const deeps=()=>document.querySelectorAll('details.deep');
document.getElementById('fexp')?.addEventListener('click',()=>deeps().forEach(d=>d.open=true));
document.getElementById('fcol')?.addEventListener('click',()=>deeps().forEach(d=>d.open=false));
function openTo(id){const el=id&&document.getElementById(id);if(!el)return;let p=el.closest('details');while(p){p.open=true;p=p.parentElement&&p.parentElement.closest('details')}}
addEventListener('hashchange',()=>openTo(decodeURIComponent(location.hash.slice(1))));
openTo(decodeURIComponent(location.hash.slice(1)));
let foldSnap=null;
addEventListener('beforeprint',()=>{foldSnap=[...deeps()].map(d=>d.open);deeps().forEach(d=>d.open=true)});
addEventListener('afterprint',()=>{if(foldSnap){[...deeps()].forEach((d,i)=>d.open=foldSnap[i]);foldSnap=null}});


</script>
